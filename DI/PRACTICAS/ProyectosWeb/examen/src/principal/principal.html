<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teléfonos</title>
    <link rel="stylesheet" href="principal.css" />
    <script src="principal.js" type="module"></script>
  </head>
  <body>
    <div id="main" class="main container">
      <h1 id="main-title" class="generic-font font-size-L text-left center-left">Teléfonos</h1>
      <div id="first-section" class="container">
        <h2 id="first-title" class="generic-font font-size-M text-left center-left">Datos</h2>
        <label id="label-01" for="display-01" class="generic-font font-size-S text-right center-stretch">Nombre y apellidos</label>
        <label id="label-02" for="display-02" class="generic-font font-size-S text-right center-stretch">Teléfonos</label>
        <input id="display-01" class="generic-font font-size-S text-left center-stretch display-part" type="text"></input>
        <input id="display-02" class="generic-font font-size-S text-left center-stretch display-part" type="text"></input>
      </div>
      <div id="second-section" class="container">
        <h2 id="second-title" class="generic-font font-size-M text-left center-left">Operaciones</h2>
        <button id="act-btn-01" class="generic-font font-size-S text-center center-stretch clickable-grey">Alta</button>
        <button id="act-btn-02" class="generic-font font-size-S text-center center-stretch clickable-grey">Modificación</button>
        <button id="act-btn-03" class="generic-font font-size-S text-center center-stretch clickable-grey">Baja</button>
      </div>
      <div id="third-section" class="container">
        <h2 id="third-title" class="generic-font font-size-M text-left center-left">Recorrido</h2>
        <button id="act-btn-04" class="generic-font font-size-S text-center center-stretch clickable-grey">Anterior</button>
        <button id="act-btn-05" class="generic-font font-size-S text-center center-stretch clickable-grey">Siguiente</button>
      </div>
      <div id="fourth-section" class="container">
        <h2 id="fourth-title" class="generic-font font-size-M text-left center-left">Indicaciones</h2>
        <div id="display-03" class="generic-font font-size-S text-left center-stretch"></div>
      </div>
      <div id="fifth-section" class="container">
        <h2 id="fifth-title" class="generic-font font-size-M text-left center-left">Confirmación</h2>
        <button id="act-btn-06" class="generic-font font-size-S text-center center-stretch clickable-grey">Aceptar</button>
        <button id="act-btn-07" class="generic-font font-size-S text-center center-stretch clickable-grey">Cancelar</button>
      </div>
    </div>

      <!-- 
      <div id="lower-section" class="container">
        <button id="act-btn-records" class="generic-font text-center center-center clickable-grey button-history">INFORME</button>
        <button id="helper-btn-tab" class="generic-font text-center center-center clickable-red button-helper">SIGUIENTE</button>
        <button id="helper-btn-enter" class="generic-font text-center center-center clickable-green button-helper">ACCIONAR</button>
      </div>
      -->
  </body>
</html>
