<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maquina</title>
    <link rel="stylesheet" href="maquina.css" />
    <script src="maquina.js" type="module"></script>
  </head>
  <body>
    <div id="machine" class="main container">
      <div id="first-title" class="display-font display-part">1 INSERT COIN</div>
      <div id="second-title" class="display-font display-part">2 CHOOSE BEVERAGE</div>
      <div id="third-title" class="display-font display-part">3 TAKE BEVERAGE</div>
      <div id="first-section" class="container">
        <button id="coin-btn-50" class="button-normal-L generic-font center-center clickable-grey">.50</button>
        <button id="coin-btn-1E" class="button-normal-L generic-font center-center clickable-grey">1€</button>
        <button id="coin-btn-2E" class="button-normal-L generic-font center-center clickable-grey">2€</button>
      </div>
      <div id="second-section" class="container"></div>
      <div id="third-section" class="container"></div>
      <div id="lower-section" class="container"></div>
    </div>
  </body>
